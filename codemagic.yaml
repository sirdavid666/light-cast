workflows:
  lightcast-android:
    name: LightCast Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true

    scripts:
      - name: Set up Flutter
        script: |
          flutter doctor

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Regenerate Gradle wrapper
        script: |
          cd android
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          cd ..

      - name: Build APK directly with Gradle (bypasses Flutter's buggy auto-migrator)
        script: |
          cd android
          ./gradlew assembleDebug
          cd ..

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - sirdavid@lightcast.app
      scripts:
        - name: Build finished
          script: echo "LightCast APK built successfully"
