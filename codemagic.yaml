workflows:
  lightcast-android:
    name: LightCast Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up Flutter
        script: |
          flutter doctor
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Run tests
        script: |
          flutter test || true
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - sirdavid@lightcast.app
      scripts:
        - name: Build finished
          script: echo "LightCast APK built successfully"
