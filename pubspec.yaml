name: light_cast
description: LightCast - Mobile Church Livestream Production System
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking between phones (WebRTC + local signaling)
  flutter_webrtc: ^1.6.0
  network_info_plus: ^5.0.3
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Image / File handling
  image_picker: ^1.1.2
  file_picker: ^8.0.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
