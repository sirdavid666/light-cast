name: Build LightCast APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lightcast-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
